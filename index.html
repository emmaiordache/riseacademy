<!DOCTYPE html>
<html lang="en">
<head>
    <title>RISE Academy: Civic Leadership for Romania's Future</title>

    <meta property="og:url" content="https://riseacademy.ro">

    <meta property="og:description" content="A civic leadership program for Romanian high school students. Workshops, mentorship, and hands-on community projects.">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        :root {
            --green:       #05673b;
            --green-dark:  #033d24;
            --green-mid:   #065c34;
            --green-light: #e6f4ed;
            --accent:        #6FB7E0;
            --accent-strong: #1F5C86;
            --accent-strong-dark: #143F5C;
            --accent-light:  #EAF2F8;
            --white:       #ffffff;
            --off-white:   #f7f9f7;
            --text:        #1a1a1a;
            --text-muted:  #5a6a62;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            color: var(--text);
        }

        h1, h2, h3, h4, h5, h6, .display-1, .display-2, .display-3, .display-4 {
            font-family: 'Montserrat', sans-serif;
        }

        /* ── NAV ── */
        .navbar-main {
            background: linear-gradient(180deg, #065c34, #033d24);
            padding: 0.75rem 0;
        }
        .navbar-main .navbar-brand img { height: 48px; }
        .navbar-main .nav-link {
            color: rgba(255,255,255,0.85) !important;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.02em;
            padding: 0.5rem 1rem !important;
            transition: color 0.2s;
        }
        .navbar-main .nav-link:hover { color: var(--accent) !important; }
        .navbar-main .dropdown-menu {
            border: none;
            box-shadow: 0 8px 32px rgba(3,61,36,0.15);
            border-radius: 10px;
        }
        .navbar-main .dropdown-item {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.5rem 1.25rem;
            color: var(--green-dark);
        }
        .navbar-main .dropdown-item:hover {
            background: var(--green-light);
            color: var(--green-dark);
        }
        .btn-nav-apply {
            background: var(--accent-strong);
            color: #fff !important;
            border-radius: 50px;
            font-weight: 800 !important;
            font-size: 0.82rem !important;
            padding: 0.45rem 1.25rem !important;
            margin-left: 0.5rem;
            transition: background 0.2s;
        }
        .btn-nav-apply:hover { background: var(--accent-strong-dark); color: #fff !important; }

        /* ── HERO ── */
        .page-header {
            min-height: 82vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .page-header-image {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(160deg, #065c34 0%, #022a18 100%);
            z-index: 0;
        }
        .page-header-image::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                radial-gradient(circle at 80% 20%, rgba(111,183,224,0.10) 0%, transparent 50%),
                radial-gradient(circle at 10% 80%, rgba(111,183,224,0.06) 0%, transparent 40%);
        }
        .page-header .container { position: relative; z-index: 1; }
        .hero-eyebrow {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent);
            opacity: 0.95;
            margin-bottom: 1rem;
        }
        .hero-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: clamp(2.4rem, 5.5vw, 4rem);
            line-height: 1.08;
            color: #fff;
            margin-bottom: 1.25rem;
        }
        .hero-title span { color: var(--accent); }
        .hero-lead {
            font-size: 1.05rem;
            line-height: 1.75;
            color: rgba(255,255,255,0.78);
            max-width: 600px;
            margin: 0 auto 2rem;
        }
        .btn-hero-primary {
            background: var(--accent-strong);
            color: #fff;
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            padding: 0.85rem 2.25rem;
            border: none;
            transition: background 0.2s, transform 0.15s;
            display: inline-block;
        }
        .btn-hero-primary:hover {
            background: var(--accent-strong-dark);
            color: #fff;
            text-decoration: none;
            transform: translateY(-2px);
        }
        .btn-hero-secondary {
            background: transparent;
            color: rgba(255,255,255,0.85);
            border: 1.5px solid rgba(255,255,255,0.35);
            border-radius: 50px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.85rem 2.25rem;
            transition: border-color 0.2s, color 0.2s;
            display: inline-block;
        }
        .btn-hero-secondary:hover {
            border-color: rgba(255,255,255,0.7);
            color: #fff;
            text-decoration: none;
        }

        .hero-stats {
            border-top: 1px solid rgba(255,255,255,0.12);
            margin-top: 3rem;
            padding-top: 2rem;
        }
        .hero-stat-item strong {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.9rem;
            color: var(--accent);
            line-height: 1;
        }
        .hero-stat-item span {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .hero-stat-divider {
            width: 1px;
            background: rgba(255,255,255,0.12);
            height: 40px;
            align-self: center;
        }

        /* ── SECTIONS ── */
        .section { padding: 5rem 0; }
        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: var(--green-dark);
        }
        .section-lead {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.8;
        }

        /* ── ABOUT — icon grid ── */
        .about-icon-wrap {
            width: 56px; height: 56px;
            border-radius: 50%;
            background: var(--green-light);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
        }
        .about-icon-wrap i { color: var(--green); font-size: 1.3rem; }
        .about-col p {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--green-dark);
            line-height: 1.5;
        }

        /* ── DARK SECTION ── */
        .section-dark {
            background: linear-gradient(180deg, #065c34, #033d24);
            padding: 5rem 0;
        }
        .section-dark .section-title { color: #fff; }
        .section-dark .section-sub { color: rgba(255,255,255,0.6); }

        /* ── RESULT BADGE ── */
        .result-badge {
            background: #fff;
            border-left: 4px solid var(--accent-strong);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 0.65rem;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
        }
        .result-badge strong {
            color: var(--green);
            margin-right: 0.65rem;
            min-width: 85px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
        }

        /* ── ROADMAP ── */
        .roadmap-step {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
            align-items: flex-start;
        }
        .roadmap-step-number {
            flex-shrink: 0;
            width: 48px; height: 48px;
            border-radius: 50%;
            background: var(--green);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
        }
        .roadmap-step-body h5 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            color: var(--green-dark);
            margin-bottom: 0.3rem;
        }
        .roadmap-step-body p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.65;
            margin: 0;
        }
        .roadmap-destination {
            background: var(--green);
            border-radius: 12px;
            padding: 1.5rem;
            color: #fff;
            margin-top: 0.5rem;
        }
        .roadmap-destination h5 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1rem;
